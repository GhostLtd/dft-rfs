# Tests and static checks. Each job is a command you can run locally: see docs/CI.md.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: test
      # Ubuntu 24.04's AppArmor blocks Chrome's sandbox for unprivileged users
      PANTHER_NO_SANDBOX: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: gd, gmp, intl, pdo_sqlite, zip
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2

      - name: Locate Composer's cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Before yarn: package.json takes @ghost/govuk-frontend-bundle from vendor/ (a portal: dependency)
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Enable corepack (Yarn version from package.json)
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: yarn

      # JavaScriptBehaviourTest exercises the compiled bundles in public/build
      - name: Build assets
        run: |
          yarn install --immutable
          yarn build

      - name: Fetch the chromedriver matching the runner's Chrome
        run: vendor/bin/bdi detect drivers

      - name: Run the test suite
        run: vendor/bin/phpunit --log-junit build/test-results/default.xml

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: build/test-results/default.xml
          if-no-files-found: warn

      - name: Upload Panther error screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panther-error-screenshots
          path: var/error-screenshots/
          if-no-files-found: ignore

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: gd, gmp, intl, pdo_sqlite, zip
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2

      - name: Locate Composer's cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Lint the service container
        run: bin/console lint:container

      - name: Lint YAML
        run: bin/console lint:yaml config translations --parse-tags

      - name: Lint Twig
        run: bin/console lint:twig templates

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      # One file per invocation: "bash -n a b" only checks a
      - name: Shell syntax
        run: |
          bash -n bin/test-mysql
          bash -n bin/screenshots
          bash -n bin/dast
          sh -n docker/test-php/entrypoint.sh
          bash -n docker/screenshots/entrypoint.sh

  mysql-tests:
    name: MySQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A disposable MySQL 8.0.18 stack (compose.mysql-tests.yaml); brings its own PHP, so no setup here
      - name: Run the MySQL suite
        run: bin/test-mysql

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mysql-test-results
          path: build/test-results/mysql.xml
          if-no-files-found: warn
