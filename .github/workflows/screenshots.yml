# Screenshots of every survey, as a downloadable artifact (see docs/Screenshots.md). Runs by hand from the Actions
# tab, or on pull requests labelled "screenshots".
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Survey type
        type: choice
        options: [all, domestic, international, pre-enquiry, roro]
        default: all
      features:
        description: APP_FEATURES (every release flag by default; drop postcode-changeover for the place-name domestic set)
        type: string
        default: postcode-changeover,outward-code-check
  pull_request:
    types: [opened, reopened, labeled, synchronize]

permissions:
  contents: read

jobs:
  screenshots:
    name: Screenshots
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'screenshots'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: screenshots-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On a pull request there are no inputs: "all", with compose.screenshots.yaml's default features
      - name: Take the screenshots
        env:
          MODE: ${{ inputs.mode || 'all' }}
          SCREENSHOTS_FEATURES: ${{ inputs.features }}
        run: bin/screenshots "$MODE"

      # Also on failure: whatever was captured, including error.png
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/output/
          retention-days: 14
          if-no-files-found: error
