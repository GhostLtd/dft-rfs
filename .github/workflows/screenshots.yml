# Screenshots of every survey, as a downloadable artifact (see docs/Screenshots.md). Runs by hand from the Actions
# tab, or when the "screenshots" label is added to a pull request.
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Survey type
        type: choice
        options: [all, domestic, international, pre-enquiry, roro]
        default: all
      features:
        description: APP_FEATURES (every release flag by default; drop postcode-changeover for the place-name domestic set)
        type: string
        default: postcode-changeover,outward-code-check
  # Only when a label is added (see the job's "if"), so ordinary PR activity doesn't log a skipped run.
  # To re-run after pushing more commits, remove and re-add the label, or run it by hand on the PR's branch.
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  screenshots:
    name: Screenshots
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'screenshots'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Queue rather than cancel, so a skipped run (another label added) can't cancel one in progress
    concurrency:
      group: screenshots-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On a pull request there are no inputs: "all", with compose.screenshots.yaml's default features
      - name: Take the screenshots
        env:
          MODE: ${{ inputs.mode || 'all' }}
          SCREENSHOTS_FEATURES: ${{ inputs.features }}
        run: bin/screenshots "$MODE"

      # Also on failure: whatever was captured, including error.png
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/output/
          retention-days: 14
          if-no-files-found: error
