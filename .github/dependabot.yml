# Keeps the pinned actions and Docker images current (see docs/CI.md). Composer and npm get security updates only:
# version-update PRs are switched off (open-pull-requests-limit: 0), and security updates come from the repository's
# "Dependabot security updates" setting.
#
# labels: [] stops Dependabot labelling its PRs: each label is a pull_request "labeled" event, which shows up as a
# skipped Screenshots run.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: []
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /docker/test-php
      - /docker/screenshots
    schedule:
      interval: monthly
    labels: []
    groups:
      docker:
        patterns: ['*']
    ignore:
      # Production runs PHP 8.3: patch releases only
      - dependency-name: php
        update-types: [version-update:semver-major, version-update:semver-minor]
      # The FrankenPHP tag carries the PHP version (php8.3), so its own releases are fine
      # Node 22 is the LTS line the screenshot tool and CI use
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    labels: []
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directories:
      - /
      - /screenshots
    schedule:
      interval: weekly
    labels: []
    open-pull-requests-limit: 0
