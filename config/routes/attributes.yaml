front_end:
    # The glob (`**/*`) is needed for the `exclude` directive to work
    resource: '../../src/Controller/**/*'
    exclude:
        - '../../src/Controller/Cron/'
        - '../../src/Controller/Admin/'
    type: attribute
    host: '%frontend_hostname%'

admin:
    resource: '../../src/Controller/Admin/**/*'
    exclude:
        - '../../src/Controller/Admin/Reports/'
    type: attribute
    host: '%admin_hostname%'
    stateless: false

admin_reports:
    resource: ../../src/Controller/Admin/Reports/
    type: attribute
    host: '%admin_hostname%'
    name_prefix: 'admin_reports_'
    prefix: /reports
    stateless: false

cron:
    resource: ../../src/Controller/Cron/
    type: attribute
    prefix: /cron
    name_prefix: 'cron_'
    # Only App Engine cron's header: App Engine strips X-Appengine-* headers from outside requests, so only its cron
    # service can send it. (Not X-Cloudscheduler: App Engine doesn't strip it, so anyone could send it, and a test
    # environment confirmed that.) The jobs are in config/gcloud-build/all/cron.yaml.
    condition: "request.headers.get('X-Appengine-Cron') === 'true'"

kernel:
    resource: ../../src/Kernel.php
    type: attribute

core_controllers:
    resource:
        path: '@GhostGovUkCoreBundle/src/Controller'
        namespace: Ghost\GovUkCoreBundle\Controller
    type: attribute
