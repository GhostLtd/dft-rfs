## GCP AppEngine config
runtime: php83
entrypoint: serve public/index.php
service: default
instance_class: F2
automatic_scaling:
  target_cpu_utilization: 0.8
  min_instances: 1
  max_instances: 4
  max_concurrent_requests: 50
  target_throughput_utilization: 0.8

# cache:clear during the build needs >128M (the buildpack PHP default);
# symfony/flex passes this to bin/console as -d memory_limit
build_env_variables:
  COMPOSER_MEMORY_LIMIT: 512M

handlers:
  - url: /build
    static_dir: public/build
  - url: /.*
    script: auto

inbound_services:
  - warmup
