## GCP AppEngine config
runtime: php83
entrypoint: serve public/index.php
instance_class: B2
service: admin

manual_scaling:
  instances: 1

# cache:clear during the build needs >128M (the buildpack PHP default);
# symfony/flex passes this to bin/console as -d memory_limit
build_env_variables:
  COMPOSER_MEMORY_LIMIT: 512M

handlers:
  - url: /build
    static_dir: public/build
    # App Engine serves these itself, so Nelmio's headers (nelmio_security.yaml) never reach them. The HSTS value matches
    # nelmio_security.yaml's (tests/Config/AppEngineStaticHeadersTest checks)
    http_headers:
      Strict-Transport-Security: max-age=2592000; includeSubDomains
      X-Content-Type-Options: nosniff
  - url: /.*
    script: auto

inbound_services:
  - warmup
